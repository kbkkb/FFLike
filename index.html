<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水晶纪行 Crystal Saga</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="frame">
      <header class="topbar">
        <div class="brand">水晶纪行 <span>CRYSTAL SAGA</span></div>
        <div class="topbar-status">
          <span class="stat" id="hudGold">金币 0</span>
          <span class="stat gem" id="hudGems">水晶 0</span>
          <span class="stat" id="hudLocation">微风村</span>
          <span class="stat" id="hudFloor"></span>
          <button id="saveBtn" class="ghost-btn">存档</button>
        </div>
      </header>

      <main>
        <section id="screen-title" class="screen active">
          <div class="title-crystals" aria-hidden="true">
            <span class="crystal c-fire"></span>
            <span class="crystal c-water"></span>
            <span class="crystal c-earth"></span>
            <span class="crystal c-wind"></span>
          </div>
          <div class="title-logo">
            <h1>水晶纪行</h1>
            <p>CRYSTAL SAGA</p>
          </div>
          <div class="title-actions">
            <button id="newGameBtn" class="primary-btn">新的冒险</button>
            <button id="continueGameBtn" class="primary-btn">继续冒险</button>
            <button id="deleteSaveBtn" class="ghost-btn">删除存档</button>
          </div>
          <p class="title-note">轻量级回合制 RPG 原型 · 用于玩法与 UI 验证</p>
        </section>

        <section id="screen-main" class="screen hidden">
          <div class="main-layout">
            <aside class="side">
              <section class="panel objective-panel">
                <h2>使命</h2>
                <p id="objectiveText"></p>
              </section>
              <section class="panel party-panel">
                <h2>队伍</h2>
                <div id="partyList"></div>
              </section>
            </aside>
            <section class="content-panel">
              <div class="tabbar">
                <button class="tab active" data-tab="map">冒险</button>
                <button class="tab" data-tab="menu">菜单</button>
              </div>
              <div id="mapView" class="tab-view"></div>
              <div id="menuView" class="tab-view hidden"></div>
            </section>
          </div>
        </section>

        <section id="screen-battle" class="screen hidden">
          <div class="battle-wrap">
            <div class="battle-top">
              <div id="battleTitle" class="battle-title">遭遇战</div>
              <div id="battleTurn" class="battle-turn">第 1 回合</div>
            </div>
            <div id="battleStage" class="battle-stage"></div>
            <div class="battle-console">
              <div id="battleLog" class="battle-log" aria-live="polite"></div>
              <div id="battleCommand" class="battle-command"></div>
            </div>
          </div>
        </section>

        <section id="screen-shop" class="screen hidden">
          <div class="shop-header">
            <div>
              <h2>晨曦商会</h2>
              <p>补给、装备与演示内购都在这里。</p>
            </div>
            <div class="shop-header-stats">
              <span id="shopGold">金币 0</span>
              <span id="shopGems" class="gem">水晶 0</span>
              <button id="shopBackBtn" class="ghost-btn">返回地图</button>
            </div>
          </div>
          <div class="shop-tabs">
            <button class="tab active" data-shop-tab="gold">金币商店</button>
            <button class="tab" data-shop-tab="crystal">水晶商店</button>
          </div>
          <div id="shopContent" class="shop-content"></div>
        </section>

        <section id="screen-gameover" class="screen hidden">
          <div class="gameover-mark">全灭</div>
          <h2>队伍全灭</h2>
          <p>冒险暂时中断。你可以从最近的存档继续，或返回标题。</p>
          <div class="title-actions">
            <button id="gameoverContinueBtn" class="primary-btn">从最近存档继续</button>
            <button id="gameoverTitleBtn" class="primary-btn">返回标题</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="modalRoot" class="modal-root hidden"></div>

  <script src="game.js" charset="utf-8"></script>
</body>
</html>
